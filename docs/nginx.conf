# =============================================================================
# Firewall-Mon — companion nginx reverse-proxy config (AUDIT-097)
# =============================================================================
#
# docker-compose.proxy.yml ships nginx-proxy-manager (a GUI proxy) but no
# hardened, ready-to-use reverse-proxy configuration. This file is a complete,
# copy-paste example for operators who run plain nginx in front of the
# single fwmon container. It provides everything the stock setup was missing:
# TLS termination, HSTS, gzip, WebSocket upgrade for the live pages, and real
# client-IP forwarding.
#
# Usage:
#   1. Put your certs at the ssl_certificate paths below (or point Certbot here).
#   2. Replace firewall.example.com with your hostname.
#   3. Mount this file at /etc/nginx/conf.d/firewall-mon.conf (see the commented
#      `nginx` service in docker-compose.proxy.yml).
#
# IMPORTANT — real client IP: the app sets `router.SetTrustedProxies(nil)`
# (cmd/api/main.go), so by default Gin IGNORES X-Forwarded-For and reports the
# proxy's IP as the client. That is the safe default for a directly-exposed
# app. To make the app honor the X-Forwarded-For set below, the app must be
# told to trust this proxy's subnet — that is a deliberate, separate change
# (it weakens a hardened default), tracked as the AUDIT-097 follow-up. Until
# then, audit logs / rate-limit keying see the proxy IP, not the real client.
# -----------------------------------------------------------------------------

# Map the Upgrade header so WebSocket connections are proxied correctly while
# normal requests get `Connection: close`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Trust the Docker bridge subnet as the source of X-Forwarded-For, and use the
# client address it carries. Narrow this to your actual proxy network.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# ---- HTTP :80 — redirect everything to HTTPS (except the ACME challenge) ----
server {
    listen 80;
    listen [::]:80;
    server_name firewall.example.com;

    # Allow Certbot HTTP-01 challenges through without a redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — TLS termination + reverse proxy to the fwmon container ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name firewall.example.com;

    # TLS. Use a modern cipher suite; TLS 1.2+ only.
    ssl_certificate     /etc/letsencrypt/live/firewall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firewall.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — preload-eligible. Only enable preload once you are certain every
    # subdomain is HTTPS-only; it is hard to undo.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Compression. (Brotli needs the ngx_brotli module; gzip ships with stock
    # nginx and covers the JSON API + HTML/CSS/JS assets.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml application/xml+rss image/svg+xml;

    # Upload ceiling for config-backup / probe payloads.
    client_max_body_size 25m;

    # ---- WebSocket-bearing routes: the live connection map + IRC console ----
    # These need the Upgrade/Connection headers and a long read timeout so the
    # socket isn't culled mid-stream.
    location ~ ^/(admin/connections|admin/irc) {
        proxy_pass http://firewall-mon:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Everything else: the API + admin/public UI ----
    location / {
        proxy_pass http://firewall-mon:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
