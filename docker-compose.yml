services:
  firewall-mon:
    build: .
    # Published to Docker Hub by .github/workflows/docker.yml on every green
    # master push. `docker compose pull` upgrades to the latest published
    # image; `docker compose build` still produces a local image under the
    # same name for from-source workflows.
    image: xphox/firewall-mon:latest
    container_name: firewall-mon
    restart: unless-stopped
    # Without an explicit cap the json-file driver grows without bound — Docker
    # only rotates when max-size is set. On the rust-01 deployment this service
    # writes ~80 MB/day, so an uncapped log reaches the GB range in weeks on the
    # same volume that already filled once in 2026-05 (see v0.10.199). The cap
    # applies from container *recreate*, not restart: an existing oversized log
    # survives `docker compose restart` and is only dropped by `up -d` replacing
    # the container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Severity 0-5 syslog (notice/warning/error/critical/alert) retention. Default in
      # internal/config/config.go is 0 (= never delete), which leads to unbounded growth
      # of syslog_messages on deployments where firewall traffic logs arrive at severity 5.
      # See CHANGELOG v0.10.199 for the 2026-05-11 incident that motivated this default.
      - RETENTION_SYSLOG_CRITICAL_DAYS=30
    ports:
      - "8080:8080"       # Web UI / API
      - "162:162/udp"     # SNMP traps
      - "514:514/udp"     # Syslog (UDP)
      - "514:514/tcp"     # Syslog (TCP)
      - "6343:6343/udp"   # sFlow
      - "8089:8089"       # Probe server
    volumes:
      # Host path for SQLite/Postgres data + config-backup archive. Default is
      # a project-local ./data dir (works out of the box for fresh deploys).
      # Production should set DATA_DIR in a .env file (gitignored) to point at
      # a dedicated partition with adequate free space — syslog_messages alone
      # can grow into the GB range. See `.env.example` and CHANGELOG v0.10.201.
      - ${DATA_DIR:-./data}:/data
      # CONFIG_DIR holds /config/config.env, which entrypoint.sh seeds with a
      # RANDOM JWT_SECRET_KEY on first run when none is supplied. The AES-256 key
      # that encrypts every {enc} secret (SNMP/IRC/SMTP) is derived from that
      # value, so this directory MUST persist and MUST move together with
      # DATA_DIR. Pre-v0.10.480 this mount was hardcoded `./config` while DATA_DIR
      # was relocatable — a deploy-from-a-new-dir regenerated the key and left
      # every credential in the relocated DB permanently undecryptable. Set
      # CONFIG_DIR alongside DATA_DIR in .env, or set JWT_SECRET_KEY/ENCRYPTION_KEY
      # explicitly so continuity never depends on this directory. See
      # docs/OPERATIONS.md and CHANGELOG v0.10.480.
      - ${CONFIG_DIR:-./config}:/config
      # Geo/ASN enrichment works out of the box from a free DB-IP Lite database
      # embedded in the image — no mount required. This optional mount is the
      # "live" override dir: databases here take precedence over the bundle. For
      # the paid live-update path (MAXMIND_LICENSE_KEY), the updater WRITES here,
      # so drop the ":ro" below (or point GEOIP_DIR at a writable host dir).
      - ${GEOIP_DIR:-./geoip}:/etc/firewall-mon/geoip:ro
    # AUDIT-096: explicit healthcheck in compose, redundant with the
    # HEALTHCHECK directive baked into the Dockerfile (v0.10.264). We
    # duplicate it here for two reasons:
    #
    #   1. `docker compose ps` shows the health status as a column
    #      ("healthy" / "unhealthy" / "starting"). If the healthcheck
    #      is only in the Dockerfile, the status shows "Up" without
    #      the health qualifier and operators have to read JSON to
    #      figure out what's going on.
    #   2. The compose `depends_on: condition: service_healthy` form
    #      requires an explicit healthcheck in this file. We don't
    #      currently depend on `firewall-mon` from any other service
    #      in this compose file (it's the only one), but a future
    #      split-out compose that runs an external reverse proxy
    #      would want `depends_on: firewall-mon: condition:
    #      service_healthy` to wait for the API to be live before
    #      bringing the proxy up. Declaring it now means that future
    #      change is a one-line edit.
    #
    # The values mirror the Dockerfile HEALTHCHECK (see v0.10.264
    # CHANGELOG). If you change them here, change them there too —
    # the static check in `internal/shell/` does not currently
    # enforce parity, so a future agent who diverges the two will
    # get a subtle "compose says healthy, image says unhealthy" race.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
