version: '3.8'

services:
  firewall-mon:
    build: .
    image: firewall-mon:latest
    container_name: firewall-mon
    restart: unless-stopped
    environment:
      # Severity 0-5 syslog (notice/warning/error/critical/alert) retention. Default in
      # internal/config/config.go is 0 (= never delete), which leads to unbounded growth
      # of syslog_messages on deployments where firewall traffic logs arrive at severity 5.
      # See CHANGELOG v0.10.199 for the 2026-05-11 incident that motivated this default.
      - RETENTION_SYSLOG_CRITICAL_DAYS=30
    ports:
      - "8080:8080"       # Web UI / API
      - "162:162/udp"     # SNMP traps
      - "514:514/udp"     # Syslog (UDP)
      - "514:514/tcp"     # Syslog (TCP)
      - "6343:6343/udp"   # sFlow
      - "8089:8089"       # Probe server
    volumes:
      - ./data:/data
      - ./config:/config
