# staticcheck configuration.
#
# We inherit staticcheck's full default check set and disable only ST1005.
# ST1005 ("error strings should not end with punctuation or newlines") assumes
# short, wrappable error strings. Several errors here are deliberately
# multi-sentence, operator-facing diagnostics (e.g. the encryption-key mismatch
# message in internal/database/crypto_canary.go) that read as prose and are
# surfaced directly to humans, not wrapped into larger errors. Trailing
# punctuation is correct for those, so ST1005 is disabled fleet-wide.
checks = ["inherit", "-ST1005"]
