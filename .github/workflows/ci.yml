name: CI

# AUDIT-004: minimum CI gate covering build, tests (with race detector),
# formatting, static analysis, and known-vulnerability scan. Future work
# (AUDIT-152 enforces gofmt as the canonical formatter check, AUDIT-121
# enforces -race coverage, AUDIT-117 calls for more test coverage which
# will land progressively) builds on this baseline.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod download
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum out of sync; run 'go mod tidy' locally and commit"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

      - name: gofmt
        # AUDIT-075 + AUDIT-152: project-wide gofmt enforcement.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build all binaries
        run: go build ./...

      - name: Tests (with -race)
        # AUDIT-121: race detector required in CI. Local runs on Windows
        # may skip this (requires CGO + a working C toolchain); CI has
        # both.
        run: go test -race -count=1 -timeout=5m ./...

  static-analysis:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        # Pinned (not @latest) so a new staticcheck release can't fail CI
        # out from under an unrelated PR. Bump deliberately. v0.7.0 = the
        # 2026.1 release; config lives in staticcheck.conf (ST1005 disabled).
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Run gosec
        # Security-focused static analysis. High-signal rules (SQLi, command
        # execution, SSRF via variable URL, weak-rand-for-tokens, unhandled
        # crypto) are ENFORCED. Excluded rules are ones that are systematically
        # false-positive for this app category and were reviewed in the
        # 2026-07-02 audit:
        #   G115 integer conversions   — Go idiom on DB-scanned counters
        #   G124 cookie Secure flag     — Secure is COOKIE_SECURE/TLS-driven by design
        #   G203 template.HTML in SVG   — report charts interpolate server-computed
        #                                 numbers/timestamps only (verified), not user input
        #   G304/G703 file-by-path      — the server reads its own config/secret files by path
        #   G401/G501 crypto/md5        — non-crypto config-change fingerprint (see configdiff),
        #                                 kept as MD5 so an algorithm change doesn't false-fire
        #                                 a CONFIG_CHANGE alert on every device at upgrade
        run: gosec -quiet -severity medium -exclude=G115,G124,G203,G304,G401,G501,G703 ./...

  integration-postgres:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # AUDIT-118: the default Build & Test job runs on SQLite; production is
    # Postgres. This job runs the build-tagged (//go:build integration) suite
    # against a real Postgres so the Postgres-only paths get exercised on every
    # push — the to_char() TimeBucket strings (v0.10.238 minute-bucket
    # regression), the pinned-conn advisory-lock migration runner,
    # EnsurePartitions/ConfigureAutovacuum, and pg_try_advisory_lock. The
    # default `go test ./...` never compiles these files (build tag).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firewall_mon
          POSTGRES_PASSWORD: firewall_mon
          POSTGRES_DB: firewall_mon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firewall_mon -d firewall_mon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          TEST_PG_DSN: postgres://firewall_mon:firewall_mon@localhost:5432/firewall_mon_test?sslmode=disable
        # -p 1 serializes the package test binaries. Both packages' NewIntegrationDB
        # does an unsynchronized `DROP SCHEMA public CASCADE` on the same TEST_PG_DSN
        # database; running them concurrently lets one process's reset nuke the
        # other's in-flight migration (nondeterministic "relation ... does not exist"
        # in TestPostgresIntegration/PopulatedTableSkipped). One binary at a time =
        # one owner of the shared schema at a time.
        run: go test -tags=integration -p 1 -count=1 -timeout=5m ./internal/database/... ./internal/api/handlers/...

  vuln-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        # AUDIT-018: bump stale deps. govulncheck flags any known CVEs
        # in the dependency tree; failing CI on a new CVE means the
        # maintainer notices before the operator does.
        run: govulncheck ./...

  tailwind-freshness:
    name: Tailwind CSS freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Audit 2026-07-01 M22: the embedded tailwind.css is a GENERATED artifact
      # (`npm run tailwind` from styles.css). The Dockerfile just COPYs the
      # committed file, and no CI gate existed, so a commit that edited styles.css
      # without regenerating tailwind.css shipped stale/broken theming to prod
      # (the v0.10.500->526 regression). This job regenerates it and fails if the
      # committed artifact is out of date, so a stale css can never merge.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Regenerate Tailwind CSS
        run: npm run tailwind

      - name: Fail if committed tailwind.css is stale
        run: |
          if ! git diff --quiet -- cmd/api/static/css/tailwind.css; then
            echo "::error::cmd/api/static/css/tailwind.css is out of date — run 'npm run tailwind' and commit the result."
            git --no-pager diff -- cmd/api/static/css/tailwind.css
            exit 1
          fi
