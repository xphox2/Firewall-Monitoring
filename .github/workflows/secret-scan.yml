name: Secret scan

# Runs gitleaks (default rules + the reviewed allowlist in .gitleaks.toml) over
# the commits a push or pull request adds. A pull request scans base..head; a
# push scans before..after. When there is no usable "before" commit (a new
# branch, the first push of a repository, or a push after history was
# rewritten) the whole history is scanned instead.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          v=8.30.1
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            range="${BEFORE}..${AFTER}"
          fi
          if [ -n "$range" ]; then
            echo "Scanning ${range}"
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range" .
          else
            echo "No usable base commit; scanning the full history"
            gitleaks git --config .gitleaks.toml --redact --no-banner .
          fi
