# gitleaks configuration: the default rules, plus a reviewed allowlist of test
# fixtures whose "secrets" are deliberately fake (placeholder JWT keys, stub PEM
# blocks such as RANDOM_IV_AAAA_body_aaaa, sample PSK/UUID values). Add a path
# here only after confirming the value is synthetic.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic secrets in tests"
paths = [
  '''^internal/api/handlers/handlers_config_revision_fortigate_test\.go$''',
  '''^internal/api/handlers/handlers_probes_lifecycle_m7_test\.go$''',
  '''^internal/api/handlers/handlers_profile_test\.go$''',
  '''^internal/api/handlers/handlers_totp_test\.go$''',
  '''^internal/api/handlers/testhelper_test\.go$''',
  '''^internal/api/middleware/auth_hardening_test\.go$''',
  '''^internal/api/middleware/pending_stage_test\.go$''',
  '''^internal/api/middleware/token_auth_test\.go$''',
  '''^internal/auth/auth_test\.go$''',
  '''^internal/configdiff/linediff_test\.go$''',
  '''^internal/configdiff/normalize_test\.go$''',
  '''^internal/configdiff/opnsense_multiline_secret_audit200_test\.go$''',
  '''^internal/configdiff/opnsense_test\.go$''',
]

# The example config leaves ADMIN_PASSWORD empty on purpose. The generic rule
# then reads the next line as its value; allow exactly that match and nothing
# else in the file.
[[allowlists]]
description = "Empty ADMIN_PASSWORD line in the example config"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^config\.env\.example$''']
regexTarget = "match"
regexes = ['''^ADMIN_PASSWORD=\s*\n\s*BCRYPT_COST=12$''']
