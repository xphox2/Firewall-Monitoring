<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall Monitor - Operations Console V2</title>
    <script nonce="{{ .Nonce }}">
        (function () {
            try {
                var t = localStorage.getItem('fwmon-theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (e) { /* storage blocked — keep default dark */ }
        })();
    </script>
    <link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/admin-fonts.css">
    <link rel="stylesheet" href="/static/v2/v2.css">
</head>
<body>
    <div id="v2-root">
        <noscript><a class="fwmon-geo-credit" href="https://db-ip.com" target="_blank" rel="noopener noreferrer">IP Geolocation by DB-IP</a></noscript>
    </div>
    <script type="module" src="/static/v2/v2.js"></script>
</body>
</html>
