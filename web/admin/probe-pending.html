<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Approvals - Firewall Monitor</title>
    <link rel="stylesheet" href="/static/css/admin-shared.css">
    <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="bg-[#0d1117] text-[#c9d1d9]">
    <div class="fixed left-0 top-0 w-60 h-screen bg-[#161b22] border-r border-[#30363d] flex flex-col z-[100]">
        <div class="p-5 border-b border-[#30363d]">
            <h2 class="text-[#58a6ff] text-sm tracking-tight">Firewall Monitor</h2>
            <div class="text-[#484f58] text-xs mt-0.5">Admin Panel</div>
        </div>
        <div class="flex-1 p-3 overflow-y-auto">
            <div class="mb-4">
                <div class="text-xs font-semibold uppercase tracking-widest text-[#484f58] px-3 py-1 pb-1.5">Monitoring</div>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin"><span class="w-4.5 text-center text-sm">&#9632;</span> Dashboard</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/devices"><span class="w-4.5 text-center text-sm">&#9881;</span> Devices</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/connections"><span class="w-4.5 text-center text-sm">&#8644;</span> Connections</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/interfaces"><span class="w-4.5 text-center text-sm">&#8646;</span> Interfaces</a>
            </div>
            <div class="mb-4">
                <div class="text-xs font-semibold uppercase tracking-widest text-[#484f58] px-3 py-1 pb-1.5">Data</div>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/syslog"><span class="w-4.5 text-center text-sm">&#9993;</span> Syslog</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/flows"><span class="w-4.5 text-center text-sm">&#8674;</span> Flows</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/alerts"><span class="w-4.5 text-center text-sm">&#9888;</span> Alerts</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/traps"><span class="w-4.5 text-center text-sm">&#9889;</span> Traps</a>
            </div>
            <div class="mb-4">
                <div class="text-xs font-semibold uppercase tracking-widest text-[#484f58] px-3 py-1 pb-1.5">Infrastructure</div>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/probes"><span class="w-4.5 text-center text-sm">&#9678;</span> Probes</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/sites"><span class="w-4.5 text-center text-sm">&#9962;</span> Sites</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/network"><span class="w-4.5 text-center text-sm">&#9733;</span> Network</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 bg-[rgba(56,139,253,0.15)] text-[#58a6ff] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm" href="/admin/probe-pending"><span class="w-4.5 text-center text-sm">&#9200;</span> Pending</a>
            </div>
            <div class="mb-4">
                <div class="text-xs font-semibold uppercase tracking-widest text-[#484f58] px-3 py-1 pb-1.5">System</div>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/settings"><span class="w-4.5 text-center text-sm">&#9881;</span> Settings</a>
                <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#8b949e] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[#21262d] hover:text-[#e6edf3]" href="/admin/irc"><span class="w-4.5 text-center text-sm">&#128172;</span> IRC</a>
            </div>
        </div>
        <div class="p-3 border-t border-[#30363d]">
            <a class="flex items-center gap-2.5 px-3 py-2.25 text-[#f85149] no-underline rounded-md mb-0.5 transition-all duration-150 cursor-pointer text-sm hover:bg-[rgba(248,81,73,0.1)]" href="#" data-action="logout"><span class="w-4.5 text-center text-sm">&#10140;</span> Logout</a>
        </div>
    </div>

    <div class="ml-60 p-6 min-h-screen">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-semibold text-[#e6edf3]">Pending Probe Approvals</h1>
        </div>

        <div class="bg-[rgba(248,81,73,0.1)] border border-[rgba(248,81,73,0.3)] text-[#f85149] p-4 rounded-lg mb-5 hidden" id="error-msg"></div>
        <div class="bg-[rgba(63,185,80,0.1)] border border-[rgba(63,185,80,0.3)] text-[#3fb150] p-4 rounded-lg mb-5 hidden" id="success-msg"></div>

        <div id="pending-container">
            <div class="text-center p-8 text-[#484f58]">Loading...</div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center" id="reject-modal">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-6 w-[520px] max-w-[92vw] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg text-[#e6edf3]">Reject Probe</h2>
                <span class="cursor-pointer" data-action="close-reject-modal">✕</span>
            </div>
            <form id="reject-form">
                <input type="hidden" id="reject-probe-id">
                <div class="mb-3">
                    <label class="block mb-1 text-[#8b949e] text-sm font-medium">Reason for rejection *</label>
                    <textarea id="reject-reason" rows="4" required placeholder="Enter reason..." class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" class="bg-[#21262d] border border-[#30363d] text-[#c9d1d9] px-3.5 py-1.5 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150 hover:bg-[#30363d]" data-action="close-reject-modal">Cancel</button>
                    <button type="submit" class="bg-[#da3633] text-white border-none px-3.5 py-1.5 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150 hover:bg-[#e5534b]">Reject</button>
                </div>
            </form>
        </div>
    </div>

    <script defer src="/static/js/admin-common.js"></script>
    <script defer src="/static/js/admin-probe-pending.js"></script>
</body>
</html>
