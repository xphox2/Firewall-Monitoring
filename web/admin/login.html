<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Firewall Monitor</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d11;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 139, 253, 0.08) 0px, transparent 40%),
                radial-gradient(at 100% 100%, rgba(137, 87, 229, 0.06) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(63, 185, 80, 0.02) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .title-gradient {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #7dd3fc 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(22, 27, 34, 0.45);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.4), 0 0 80px 0 rgba(56, 139, 253, 0.04);
        }
        .input-premium {
            background: rgba(13, 17, 23, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-premium:focus {
            border-color: #7dd3fc !important;
            box-shadow: 0 0 12px rgba(125, 211, 252, 0.2) !important;
            outline: none;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #0284c7 0%, #10b981 100%) !important;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gradient:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4) !important;
        }
        .btn-gradient:active:not(:disabled) {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">
    <div class="w-full max-w-[420px] px-5">
        <div class="glass-panel rounded-[24px] p-10">
            <h1 class="text-center text-3xl font-bold mb-2 title-gradient">Firewall Monitor</h1>
            <p class="text-center text-sm text-[#8b949e] mb-8 font-medium">Administration Panel Login</p>
            
            <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2.5 rounded-xl mb-6 text-center text-sm font-medium"></div>
            
            <form id="login-form">
                <div class="mb-6">
                    <label for="username" class="block mb-2 text-xs font-semibold uppercase tracking-wider text-[#8b949e]">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="w-full px-4 py-3.5 rounded-xl input-premium text-white text-base">
                </div>
                <div class="mb-8">
                    <label for="password" class="block mb-2 text-xs font-semibold uppercase tracking-wider text-[#8b949e]">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full px-4 py-3.5 rounded-xl input-premium text-white text-base">
                </div>
                <button type="submit" id="login-btn" class="w-full px-4 py-3.5 rounded-xl border-none btn-gradient text-white text-base font-bold cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">Login</button>
            </form>
            
            <div class="text-center mt-6">
                <a href="/" class="text-sm font-medium text-[#7dd3fc] hover:text-[#c4b5fd] no-underline transition-colors">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script defer src="/static/js/admin-login.js"></script>
</body>
</html>
