<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Firewall Monitor</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="min-h-screen flex items-center justify-center text-white" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
    <div class="w-full max-w-[400px] px-5">
        <div class="bg-white/5 rounded-[20px] p-10 border border-white/10">
            <h1 class="text-center text-2xl mb-2 text-cyan-400">Firewall Monitor</h1>
            <p class="text-center text-sm text-white/50 mb-8">Admin Panel Login</p>
            
            <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-3 py-2 rounded-lg mb-5 text-center"></div>
            
            <form id="login-form">
                <div class="mb-5">
                    <label for="username" class="block mb-2 text-sm text-white/70">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="w-full px-4 py-3 rounded-xl border border-white/20 bg-white/5 text-white text-base transition-colors focus:outline-none focus:border-cyan-400">
                </div>
                <div class="mb-5">
                    <label for="password" class="block mb-2 text-sm text-white/70">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-white/20 bg-white/5 text-white text-base transition-colors focus:outline-none focus:border-cyan-400">
                </div>
                <button type="submit" id="login-btn" class="w-full px-4 py-3 rounded-xl border-none bg-gradient-to-r from-cyan-400 to-emerald-400 text-[#1a1a2e] text-base font-semibold cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-cyan-400/30 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none">Login</button>
            </form>
            
            <div class="text-center mt-5">
                <a href="/" class="text-cyan-400 no-underline hover:underline">← Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script defer src="/static/js/admin-login.js"></script>
</body>
</html>
