<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRC Management - Firewall Monitor</title>
    <link rel="stylesheet" href="/static/css/admin-shared.css">
    <link rel="stylesheet" href="/static/css/admin-design-system.css">
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <style nonce="{{ .Nonce }}">
        .nav-item:hover { background: #21262d; color: #e6edf3; }
        .nav-item.active { background: rgba(56,139,253,0.15); color: #58a6ff; }
        .nav-item.danger:hover { background: rgba(248,81,73,0.1); }
        .btn:hover { background: #2ea043; }
        .btn.danger:hover { background: #e5534b; }
        .btn.secondary:hover { background: #30363d; }
        tr:hover { background: #1c2128; }
        .tab-btn:hover { color: #e6edf3; }
        /* AUDIT-049: no .tab-btn.active rule existed, so switchTab()'s
           classList.add('active') had no visual effect and the active
           highlight was hardcoded as Tailwind utilities on the Servers
           button (broken once another tab was clicked). This rule drives
           the highlight for whichever tab carries .active. */
        .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Firewall Monitor</h2>
            <div class="subtitle">Admin Panel</div>
        </div>
        <div class="sidebar-nav" id="sidebar-nav-placeholder">
            <!-- Sidebar rendered by AdminCommon.renderSidebar() -->
        </div>
        <div class="sidebar-footer">
            <a class="nav-item danger" href="#" data-action="logout"><span class="nav-icon" aria-hidden="true">&#10140;</span> Logout</a>
        </div>
    </div>

    <main class="main-content p-6" id="main-content" tabindex="-1">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-semibold text-[#e6edf3]">IRC Management</h1>
            <button class="bg-[#238636] text-white border-none px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150" data-action="open-server-modal">Add Server</button>
        </div>

        <div id="alertMessage" class="hidden"></div>

        <div class="flex gap-1 mb-5 border-b border-[#30363d]">
            <button class="tab-btn active bg-none border-none text-[#8b949e] px-2.5 py-2.5 cursor-pointer text-sm border-b-2 border-transparent mb-[-1px]" data-tab="servers">Servers</button>
            <button class="tab-btn bg-none border-none text-[#8b949e] px-2.5 py-2.5 cursor-pointer text-sm border-b-2 border-transparent mb-[-1px]" data-tab="channels">Channels</button>
            <button class="tab-btn bg-none border-none text-[#8b949e] px-2.5 py-2.5 cursor-pointer text-sm border-b-2 border-transparent mb-[-1px]" data-tab="commands">Commands</button>
            <button class="tab-btn bg-none border-none text-[#8b949e] px-2.5 py-2.5 cursor-pointer text-sm border-b-2 border-transparent mb-[-1px]" data-tab="send">Send Message</button>
        </div>

        <div id="tab-servers" class="tab-content active">
            <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-5 mb-4">
                <h2 class="text-base font-semibold text-[#e6edf3] mb-4 flex justify-between items-center">IRC Servers</h2>
                <div id="serversList">
                    <div class="text-center p-7.5 text-[#8b949e]">Loading servers...</div>
                </div>
            </div>
        </div>

        <div id="tab-channels" class="tab-content">
            <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-5 mb-4">
                <h2 class="text-base font-semibold text-[#e6edf3] mb-4 flex justify-between items-center">
                    Channels
                    <button class="bg-[#238636] text-white border-none px-2.5 py-1 rounded-md cursor-pointer text-xs font-medium transition-colors duration-150" data-action="open-channel-modal">Add Channel</button>
                </h2>
                <div id="channelsList">
                    <div class="text-center p-10 text-[#8b949e]">Loading channels...</div>
                </div>
            </div>
        </div>

        <div id="tab-commands" class="tab-content">
            <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-5 mb-4">
                <h2 class="text-base font-semibold text-[#e6edf3] mb-4 flex justify-between items-center">
                    Custom Commands
                    <button class="bg-[#238636] text-white border-none px-2.5 py-1 rounded-md cursor-pointer text-xs font-medium transition-colors duration-150" data-action="open-command-modal">Add Command</button>
                </h2>
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="p-2 text-left border-b border-[#30363d] text-[#8b949e] font-medium text-xs uppercase tracking-wider">Command</th>
                            <th class="p-2 text-left border-b border-[#30363d] text-[#8b949e] font-medium text-xs uppercase tracking-wider">Description</th>
                            <th class="p-2 text-left border-b border-[#30363d] text-[#8b949e] font-medium text-xs uppercase tracking-wider">Type</th>
                            <th class="p-2 text-left border-b border-[#30363d] text-[#8b949e] font-medium text-xs uppercase tracking-wider">Admin Only</th>
                            <th class="p-2 text-left border-b border-[#30363d] text-[#8b949e] font-medium text-xs uppercase tracking-wider">Enabled</th>
                            <th class="p-2 text-left border-b border-[#30363d] text-[#8b949e] font-medium text-xs uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="commandsList">
                        <tr><td colspan="6" class="text-center p-7.5 text-[#8b949e]">Loading commands...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-send" class="tab-content">
            <div class="bg-[#161b22] border border-[#30363d] rounded-lg p-5 mb-4">
                <h2 class="text-base font-semibold text-[#e6edf3] mb-4 flex justify-between items-center">Send IRC Message</h2>
                <div class="mb-3">
                    <label for="sendServerSelect" class="block mb-1 text-[#8b949e] text-xs font-medium">Server</label>
                    <select id="sendServerSelect" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm">
                        <option value="">Select a server...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sendChannelSelect" class="block mb-1 text-[#8b949e] text-xs font-medium">Channel</label>
                    <select id="sendChannelSelect" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm">
                        <option value="">Select a channel...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sendMessage" class="block mb-1 text-[#8b949e] text-xs font-medium">Message</label>
                    <textarea id="sendMessage" rows="4" placeholder="Enter your message..." class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm"></textarea>
                </div>
                <button class="bg-[#238636] text-white border-none px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150" data-action="send-message">Send Message</button>
            </div>
        </div>
    </main>

    <div id="serverModal" class="modal fixed top-0 left-0 right-0 bottom-0 bg-black/60 z-[200] items-center justify-center">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-6 w-[520px] max-w-[92vw] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="serverModalTitle" class="text-lg text-[#e6edf3]">Add Server</h2>
                <button class="cursor-pointer text-xl text-[#8b949e] bg-none border-none p-1" data-action="close-server-modal">&times;</button>
            </div>
            <form id="serverForm">
                <input type="hidden" id="serverId">
                <div class="mb-3">
                    <label for="serverName" class="block mb-1 text-[#8b949e] text-xs font-medium">Server Name</label>
                    <input type="text" id="serverName" required placeholder="e.g., My IRC Server" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label for="serverHost" class="block mb-1 text-[#8b949e] text-xs font-medium">Server Host</label>
                        <input type="text" id="serverHost" required placeholder="e.g., irc.example.com" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                    <div>
                        <label for="serverPort" class="block mb-1 text-[#8b949e] text-xs font-medium">Server Port</label>
                        <input type="number" id="serverPort" value="6667" min="1" max="65535" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label for="serverNick" class="block mb-1 text-[#8b949e] text-xs font-medium">Nick</label>
                        <input type="text" id="serverNick" required placeholder="BotNick" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                    <div>
                        <label for="serverUsername" class="block mb-1 text-[#8b949e] text-xs font-medium">Username</label>
                        <input type="text" id="serverUsername" placeholder="username" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="serverRealName" class="block mb-1 text-[#8b949e] text-xs font-medium">Real Name</label>
                    <input type="text" id="serverRealName" placeholder="Real Name" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="mb-3">
                    <label for="serverPassword" class="block mb-1 text-[#8b949e] text-xs font-medium">Server Password (optional)</label>
                    <input type="password" id="serverPassword" placeholder="Server password" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label for="serverNickServPassword" class="block mb-1 text-[#8b949e] text-xs font-medium">NickServ Password (optional)</label>
                        <input type="password" id="serverNickServPassword" placeholder="For IDENTIFY" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                    <div>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="serverNickServIdentify" class="w-auto">
                            <span class="text-[#c9d1d9] text-sm">Identify to NickServ</span>
                        </label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="serverUseTLS" class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Use TLS/SSL</span>
                    </label>
                </div>
                <div class="mb-3">
                    <label class="block mb-1 text-[#8b949e] text-xs font-medium">SASL Authentication</label>
                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <div>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="serverSASLEnabled" class="w-auto">
                                <span class="text-[#c9d1d9] text-sm">Enable SASL</span>
                            </label>
                        </div>
                    </div>
                    <div id="saslFields" class="hidden">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label for="serverSASLUsername" class="block mb-1 text-[#8b949e] text-xs font-medium">SASL Username</label>
                                <input type="text" id="serverSASLUsername" placeholder="SASL username" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                            </div>
                            <div>
                                <label for="serverSASLPassword" class="block mb-1 text-[#8b949e] text-xs font-medium">SASL Password</label>
                                <input type="password" id="serverSASLPassword" placeholder="SASL password" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="serverEnabled" checked class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Enabled</span>
                    </label>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="serverAutoReconnect" checked class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Auto Reconnect</span>
                    </label>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" class="bg-[#21262d] border border-[#30363d] text-[#c9d1d9] px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150" data-action="close-server-modal">Cancel</button>
                    <button type="button" class="bg-[#21262d] border border-[#30363d] text-[#c9d1d9] px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150" data-action="test-server">Test</button>
                    <button type="submit" class="bg-[#238636] text-white border-none px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="channelModal" class="modal fixed top-0 left-0 right-0 bottom-0 bg-black/60 z-[200] items-center justify-center">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-6 w-[520px] max-w-[92vw] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="channelModalTitle" class="text-lg text-[#e6edf3]">Add Channel</h2>
                <button class="cursor-pointer text-xl text-[#8b949e] bg-none border-none p-1" data-action="close-channel-modal">&times;</button>
            </div>
            <form id="channelForm">
                <input type="hidden" id="channelId">
                <div class="mb-3">
                    <label for="channelServerId" class="block mb-1 text-[#8b949e] text-xs font-medium">Server</label>
                    <select id="channelServerId" required class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                        <option value="">Select a server...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="channelName" class="block mb-1 text-[#8b949e] text-xs font-medium">Channel Name</label>
                    <input type="text" id="channelName" required placeholder="e.g., #mychannel" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="mb-3">
                    <label for="channelKey" class="block mb-1 text-[#8b949e] text-xs font-medium">Channel Key (optional)</label>
                    <input type="password" id="channelKey" placeholder="Channel password" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label for="channelChanServName" class="block mb-1 text-[#8b949e] text-xs font-medium">ChanServ Name (optional)</label>
                        <input type="text" id="channelChanServName" placeholder="NickServ" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                    <div>
                        <label for="channelChanServPass" class="block mb-1 text-[#8b949e] text-xs font-medium">ChanServ Password</label>
                        <input type="password" id="channelChanServPass" placeholder="For IDENTIFY" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="channelAutoJoin" checked class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Auto Join</span>
                    </label>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="channelSendAlerts" class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Send Alerts to Channel</span>
                    </label>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="channelSendStatus" class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Auto-Post Status</span>
                    </label>
                </div>
                <div class="mb-3 hidden" id="statusIntervalGroup">
                    <label for="channelStatusInterval" class="block mb-1 text-[#8b949e] text-xs font-medium">Status Interval (minutes)</label>
                    <input type="number" id="channelStatusInterval" min="1" max="1440" value="5" placeholder="Interval in minutes" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="channelEnabled" checked class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Enabled</span>
                    </label>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" class="bg-[#21262d] border border-[#30363d] text-[#c9d1d9] px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150" data-action="close-channel-modal">Cancel</button>
                    <button type="submit" class="bg-[#238636] text-white border-none px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="commandModal" class="modal fixed top-0 left-0 right-0 bottom-0 bg-black/60 z-[200] items-center justify-center">
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-6 w-[520px] max-w-[92vw] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="commandModalTitle" class="text-lg text-[#e6edf3]">Add Command</h2>
                <button class="cursor-pointer text-xl text-[#8b949e] bg-none border-none p-1" data-action="close-command-modal">&times;</button>
            </div>
            <form id="commandForm">
                <input type="hidden" id="commandId">
                <div class="mb-3">
                    <label for="commandCmd" class="block mb-1 text-[#8b949e] text-xs font-medium">Command</label>
                    <input type="text" id="commandCmd" required placeholder="e.g., !status" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="mb-3">
                    <label for="commandDescription" class="block mb-1 text-[#8b949e] text-xs font-medium">Description</label>
                    <input type="text" id="commandDescription" placeholder="What this command does" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                </div>
                <div class="mb-3">
                    <label for="commandType" class="block mb-1 text-[#8b949e] text-xs font-medium">Command Type</label>
                    <select id="commandType" class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none">
                        <option value="static">Static Response</option>
                        <option value="status">System Status</option>
                        <option value="stats">System Stats</option>
                        <option value="custom">Custom Script</option>
                    </select>
                </div>
                <div class="mb-3" id="responseField">
                    <label for="commandResponse" class="block mb-1 text-[#8b949e] text-xs font-medium">Response</label>
                    <textarea id="commandResponse" rows="4" placeholder="Response text or script..." class="w-full p-2 bg-[#0d1117] border border-[#30363d] rounded-md text-[#c9d1d9] text-sm focus:border-[#58a6ff] focus:outline-none"></textarea>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="commandAdminOnly" class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Admin Only</span>
                    </label>
                </div>
                <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="commandEnabled" checked class="w-auto">
                        <span class="text-[#c9d1d9] text-sm">Enabled</span>
                    </label>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" class="bg-[#21262d] border border-[#30363d] text-[#c9d1d9] px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150" data-action="close-command-modal">Cancel</button>
                    <button type="submit" class="bg-[#238636] text-white border-none px-3.5 py-1.75 rounded-md cursor-pointer text-sm font-medium transition-colors duration-150">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script defer src="/static/js/admin-common.js"></script>
    <script nonce="{{ .Nonce }}">
    document.addEventListener('DOMContentLoaded', function() {
        AdminCommon.renderSidebar();
        AdminCommon.renderMobileChrome(); // AUDIT-055
    });
    </script>
    <script defer src="/static/js/admin-irc.js"></script>
</body>
</html>
